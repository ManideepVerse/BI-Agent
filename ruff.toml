line-length = 110
target-version = "py311"

[lint]
# Deliberately scoped to rules that catch defects — undefined names, unused
# imports, shadowed variables — rather than style preferences. A lint gate that
# fails on `Optional[str]` vs `str | None` trains people to ignore it.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length is enforced by the formatter, not by failing CI
    "E741",  # ambiguous variable names; not worth a build failure
]

[lint.per-file-ignores]
"scripts/*" = ["E402"]  # sys.path manipulation before imports is deliberate
"tests/*" = ["E402"]
